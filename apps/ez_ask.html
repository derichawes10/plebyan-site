<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EZ ASK — grounded Q&amp;A over your own corpus</title>
<!-- ============================================================================
  EZ ASK  v1.0
  Offline, single-file, vendor-agnostic retrieval-grounded Q&A.
  Load your corpus (md / txt / html / json bundle) -> client-side BM25 retrieval
  -> answer generated by ANY OpenAI-compatible endpoint (Ollama, DeepSeek,
  Open WebUI, LM Studio). The model only sees retrieved chunks; it is told to
  answer from context only, cite the source file, or say NOT IN CORPUS.

  Architecture / constraints (EZ Suite locked):
    - Single HTML file, no build step.
    - Zero external runtime deps. Pure-JS BM25. MIT-spirit / public-domain only.
    - Offline retrieval. Network is used ONLY for the model call you configure.
    - Fail-Loud: endpoint errors are surfaced verbatim; no fabricated answers,
      no silent fallback. If retrieval returns nothing above threshold, the
      model is NOT called and the tool says NOT IN CORPUS.
    - esc() on every value rendered via innerHTML.

  CHANGELOG
    v1.0 (2026-06-17): Initial build. Corpus ingest (md/txt/html/json),
      heading-aware chunker with overlap, BM25 retrieval, OpenAI-compatible
      chat call with presets (Ollama / DeepSeek / Open WebUI / custom),
      grounded system prompt, connection test, localStorage persistence.
============================================================================ -->
<style>
  :root{
    --bg:#0f1419; --panel:#161c24; --panel-2:#1d242e; --line:#2a3340;
    --fg:#e6edf3; --fg-dim:#a9b6c4; --fg-mute:#6b7785;
    --teal:#3fb6b2; --good:#56d364; --good-soft:#1c3b25; --amber:#e3b341;
    --bad:#f85149; --accent:#4493f8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:13px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
  .topbar h1{font-size:14px;margin:0;letter-spacing:1px;color:var(--teal)}
  .badge{font-size:10px;color:var(--bg);background:var(--teal);border-radius:3px;padding:1px 6px;font-weight:700}
  .endpoint-pill{margin-left:auto;font-size:10px;color:var(--fg-mute);display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--fg-mute)}
  .dot.ok{background:var(--good)} .dot.bad{background:var(--bad)} .dot.warn{background:var(--amber)}
  .tabs{display:flex;gap:2px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
  .tab{padding:7px 14px;font-size:12px;color:var(--fg-dim);background:none;border:0;border-bottom:2px solid transparent;cursor:pointer}
  .tab.active{color:var(--teal);border-bottom-color:var(--teal)}
  .view{flex:1;overflow:auto;padding:14px;display:none}
  .view.active{display:block}
  .wrap{max-width:920px;margin:0 auto}
  label{display:block;font-size:11px;color:var(--fg-dim);margin:10px 0 3px}
  input,select,textarea,button{font:inherit;color:var(--fg);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:7px 9px}
  input,select,textarea{width:100%}
  textarea{resize:vertical;line-height:1.45}
  button{cursor:pointer;background:var(--panel-2);width:auto}
  button:hover{border-color:var(--teal)}
  button.primary{background:var(--teal);color:var(--bg);border-color:var(--teal);font-weight:700}
  button.primary:hover{filter:brightness(1.08)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row > *{flex:1;min-width:120px}
  .askbox{display:flex;gap:8px}
  .askbox textarea{flex:1;min-height:54px}
  .answer{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;white-space:pre-wrap;word-wrap:break-word}
  .answer.notincorpus{border-color:var(--amber);color:var(--amber)}
  .answer.err{border-color:var(--bad);color:var(--bad);white-space:pre-wrap}
  .meta{font-size:10px;color:var(--fg-mute);margin-top:8px}
  .src{font-size:10px;color:var(--accent)}
  .chunklist{margin-top:14px}
  .chunk{background:var(--panel-2);border-left:2px solid var(--line);padding:8px 10px;margin-bottom:6px;border-radius:0 4px 4px 0}
  .chunk-head{font-size:10px;color:var(--fg-mute);display:flex;justify-content:space-between}
  .chunk-head b{color:var(--accent);font-weight:600}
  .chunk-body{font-size:11px;color:var(--fg-dim);margin-top:4px;max-height:0;overflow:hidden;transition:max-height .15s}
  .chunk.open .chunk-body{max-height:600px;overflow:auto}
  .dropzone{border:2px dashed var(--line);border-radius:8px;padding:34px;text-align:center;color:var(--fg-mute);cursor:pointer}
  .dropzone.drag{border-color:var(--teal);color:var(--teal);background:var(--panel)}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--fg-mute);font-weight:600}
  td .del{color:var(--bad);background:none;border:0;padding:0 4px}
  .hint{font-size:11px;color:var(--fg-mute);margin-top:4px}
  .stat{display:inline-block;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:4px 9px;margin:4px 6px 0 0;font-size:11px}
  .stat b{color:var(--teal)}
  .spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .keynote{font-size:10px;color:var(--amber);margin-top:3px}
</style>
</head>
<body>
  <div class="topbar">
    <h1>EZ ASK</h1>
    <span class="badge" id="verBadge">v1.0</span>
    <span class="endpoint-pill"><span class="dot" id="connDot"></span><span id="endpointLabel">no endpoint</span></span>
  </div>
  <div class="tabs">
    <button class="tab active" data-view="ask">Ask</button>
    <button class="tab" data-view="kb">Knowledge</button>
    <button class="tab" data-view="settings">Settings</button>
  </div>

  <!-- ASK -->
  <div class="view active" id="view-ask"><div class="wrap">
    <div id="kbWarn"></div>
    <label>Question</label>
    <div class="askbox">
      <textarea id="q" placeholder="Ask something answerable from your corpus. Ctrl+Enter to send."></textarea>
      <button class="primary" id="askBtn" style="min-width:90px">Ask</button>
    </div>
    <div class="hint">Retrieval is offline. Only the top matching chunks + your question are sent to the model.</div>
    <div id="answerWrap"></div>
    <div class="chunklist" id="chunkList"></div>
  </div></div>

  <!-- KNOWLEDGE -->
  <div class="view" id="view-kb"><div class="wrap">
    <div class="dropzone" id="drop">Drop files here, or click to choose<br>
      <span class="hint">.md &middot; .txt &middot; .html &middot; .json (EZ ASK bundle)</span>
    </div>
    <input type="file" id="fileIn" multiple accept=".md,.markdown,.txt,.html,.htm,.json" style="display:none">
    <div id="kbStats"></div>
    <div class="row" style="margin-top:12px">
      <button id="exportBtn">Export bundle (.json)</button>
      <button id="clearBtn">Clear corpus</button>
    </div>
    <table id="srcTable"></table>
  </div></div>

  <!-- SETTINGS -->
  <div class="view" id="view-settings"><div class="wrap">
    <label>Backend preset</label>
    <select id="preset">
      <option value="ollama">Ollama (local, free) — localhost:11434</option>
      <option value="deepseek">DeepSeek API</option>
      <option value="openwebui">Open WebUI (local)</option>
      <option value="custom">Custom OpenAI-compatible</option>
    </select>
    <label>Endpoint URL (chat/completions)</label>
    <input id="endpoint" placeholder="http://localhost:11434/v1/chat/completions">
    <label>Model</label>
    <input id="model" placeholder="llama3.1:8b">
    <label>API key <span class="keynote">stored only in this browser's localStorage on this device</span></label>
    <input id="apiKey" type="password" placeholder="(blank for local Ollama)">
    <div class="row">
      <div><label>Retrieved chunks (top-k)</label><input id="topk" type="number" min="1" max="20" value="6"></div>
      <div><label>Temperature</label><input id="temp" type="number" min="0" max="1" step="0.1" value="0.1"></div>
      <div><label>Min match score</label><input id="minscore" type="number" min="0" step="0.1" value="1.0"></div>
    </div>
    <label>System prompt (grounding rules)</label>
    <textarea id="sysprompt" rows="8"></textarea>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="testBtn">Test connection</button>
      <button id="saveBtn">Save settings</button>
    </div>
    <div id="testOut" class="meta"></div>
  </div></div>

<script>
"use strict";
console.log("%cEZ ASK v1.0","color:#3fb6b2;font-weight:700"," — offline retrieval, vendor-agnostic model call. Fail-Loud.");

/* ---------------- utils ---------------- */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function $(id){return document.getElementById(id);}
const LS_DOCS="ez_ask_docs_v1";
const LS_CFG="ez_ask_cfg_v1";

const DEFAULT_SYS =
"You are a retrieval-grounded assistant for a Washington State land surveyor.\n"+
"Answer ONLY using the CONTEXT provided below. After each factual claim, cite the source file in brackets, e.g. [DECISIONS.md].\n"+
"If the CONTEXT does not contain the answer, reply with exactly: NOT IN CORPUS\n"+
"Do not use outside knowledge. Do not guess. Do not soften a missing answer into a plausible one.";

const PRESETS={
  ollama:{endpoint:"http://localhost:11434/v1/chat/completions",model:"llama3.1:8b",key:false},
  deepseek:{endpoint:"https://api.deepseek.com/chat/completions",model:"deepseek-chat",key:true},
  openwebui:{endpoint:"http://localhost:3000/api/chat/completions",model:"llama3.1:8b",key:true},
  custom:{endpoint:"",model:"",key:true}
};

/* ---------------- state ---------------- */
let docs=[];        // [{source, text}]
let chunks=[];      // [{id, source, heading, text, tokens}]
let idf={};         // token -> idf
let avgdl=0;

/* ---------------- chunker (single source of truth) ---------------- */
function htmlToText(html){
  const d=document.createElement("div"); d.innerHTML=html;
  d.querySelectorAll("script,style").forEach(n=>n.remove());
  return (d.textContent||"").replace(/\n{3,}/g,"\n\n").trim();
}
// Heading-aware split with ~1000-char target and ~150-char overlap.
// Line-aware: a markdown heading is a boundary whether or not a blank line
// follows it. The '#' markup is dropped from the body and kept as .heading.
function chunkDoc(source,text){
  const out=[];
  const lines=text.replace(/\r\n/g,"\n").split("\n");
  let heading="", buf="";
  const TARGET=1000, OVERLAP=150;
  const flush=()=>{ if(buf.trim()){ out.push({source,heading,text:buf.trim()}); } buf=""; };
  for(const line of lines){
    const hm=line.match(/^#{1,6}\s+(.*\S)\s*$/);
    if(hm){ flush(); heading=hm[1].trim(); continue; }
    if((buf.length+line.length)>TARGET && buf.length>0){
      const tail=buf.slice(-OVERLAP);
      flush();
      buf=(heading?("["+heading+"] "):"")+tail+" ";
    }
    buf+=line+"\n";
  }
  flush();
  return out;
}

/* ---------------- BM25 ---------------- */
const STOP=new Set("a an the of to in on for and or is are was be been being it its this that these those with as at by from into than then so if not no but we you i he she they them his her their our your my me do does did have has had will would can could should may might must".split(" "));
function tok(s){
  return (s.toLowerCase().match(/[a-z0-9][a-z0-9'.\u00b0\/-]*/g)||[])
    .filter(w=>w.length>1 && !STOP.has(w));
}
function buildIndex(){
  chunks=[];
  for(const d of docs){ for(const c of chunkDoc(d.source,d.text)){ c.id=chunks.length; c.tokens=tok((c.heading?c.heading+" ":"")+c.text); chunks.push(c); } }
  const df={}; let total=0;
  for(const c of chunks){ total+=c.tokens.length; const seen=new Set(); for(const t of c.tokens){ if(!seen.has(t)){ df[t]=(df[t]||0)+1; seen.add(t);} } }
  const N=chunks.length||1; avgdl=total/N;
  idf={}; for(const t in df){ idf[t]=Math.log(1+(N-df[t]+0.5)/(df[t]+0.5)); }
}
function retrieve(query,k,minScore){
  if(!chunks.length) return [];
  const qt=tok(query); const k1=1.5,b=0.75;
  const scored=chunks.map(c=>{
    const tf={}; for(const t of c.tokens) tf[t]=(tf[t]||0)+1;
    let s=0;
    for(const t of qt){ const f=tf[t]; if(!f) continue;
      const denom=f+k1*(1-b+b*(c.tokens.length/(avgdl||1)));
      s+=(idf[t]||0)*(f*(k1+1))/denom; }
    return {c,score:s};
  }).filter(x=>x.score>=minScore).sort((a,b)=>b.score-a.score);
  return scored.slice(0,k);
}

/* ---------------- config ---------------- */
function loadCfg(){
  let c={}; try{ c=JSON.parse(localStorage.getItem(LS_CFG)||"{}"); }catch(e){}
  $("preset").value=c.preset||"ollama";
  $("endpoint").value=c.endpoint||PRESETS.ollama.endpoint;
  $("model").value=c.model||PRESETS.ollama.model;
  $("apiKey").value=c.apiKey||"";
  $("topk").value=c.topk||6;
  $("temp").value=(c.temp!=null?c.temp:0.1);
  $("minscore").value=(c.minscore!=null?c.minscore:1.0);
  $("sysprompt").value=c.sysprompt||DEFAULT_SYS;
  refreshEndpointPill();
}
function cfg(){return{
  preset:$("preset").value, endpoint:$("endpoint").value.trim(), model:$("model").value.trim(),
  apiKey:$("apiKey").value, topk:parseInt($("topk").value)||6,
  temp:parseFloat($("temp").value)||0, minscore:parseFloat($("minscore").value)||0,
  sysprompt:$("sysprompt").value
};}
function saveCfg(){ localStorage.setItem(LS_CFG,JSON.stringify(cfg())); refreshEndpointPill(); }
function refreshEndpointPill(){
  const c=cfg();
  $("endpointLabel").textContent=c.endpoint? (c.model+" @ "+c.endpoint.replace(/^https?:\/\//,"").split("/")[0]) : "no endpoint";
}

/* ---------------- persistence of corpus ---------------- */
function saveDocs(){
  try{ localStorage.setItem(LS_DOCS,JSON.stringify({format:"ez_ask_docs_v1",docs})); }
  catch(e){ alert("Corpus too large for localStorage ("+e.message+"). Export the bundle and load it each session instead."); }
}
function loadDocs(){
  try{ const o=JSON.parse(localStorage.getItem(LS_DOCS)||"null"); if(o&&Array.isArray(o.docs)) docs=o.docs; }catch(e){}
  buildIndex();
}

/* ---------------- ingest ---------------- */
function addDoc(source,raw,kind){
  let text=raw;
  if(kind==="html") text=htmlToText(raw);
  if(kind==="json"){
    let o; try{ o=JSON.parse(raw); }catch(e){ throw new Error(source+": invalid JSON — "+e.message); }
    if(o && o.format==="ez_ask_docs_v1" && Array.isArray(o.docs)){
      for(const d of o.docs){ if(d&&d.source&&typeof d.text==="string") upsert(d.source,d.text); }
      return;
    }
    text=typeof o==="string"?o:JSON.stringify(o,null,2);
  }
  upsert(source,text);
}
function upsert(source,text){
  const i=docs.findIndex(d=>d.source===source);
  if(i>=0) docs[i].text=text; else docs.push({source,text});
}
async function ingestFiles(files){
  for(const f of files){
    const name=f.name; const ext=(name.split(".").pop()||"").toLowerCase();
    const kind=(ext==="html"||ext==="htm")?"html":(ext==="json"?"json":"text");
    const raw=await f.text();
    try{ addDoc(name,raw,kind); }
    catch(e){ alert(esc(e.message)); }
  }
  buildIndex(); saveDocs(); renderKB();
}

/* ---------------- model call (OpenAI-compatible) ---------------- */
async function callModel(question,hits){
  const c=cfg();
  if(!c.endpoint) throw new Error("No endpoint configured. Set one in Settings.");
  const context=hits.map(h=>"["+h.c.source+(h.c.heading?(" \u00a7 "+h.c.heading):"")+"]\n"+h.c.text).join("\n\n---\n\n");
  const messages=[
    {role:"system",content:c.sysprompt},
    {role:"user",content:"CONTEXT:\n"+context+"\n\n---\nQUESTION: "+question}
  ];
  const headers={"Content-Type":"application/json"};
  if(c.apiKey) headers["Authorization"]="Bearer "+c.apiKey;
  let res;
  try{
    res=await fetch(c.endpoint,{method:"POST",headers,body:JSON.stringify({model:c.model,messages,temperature:c.temp,stream:false})});
  }catch(netErr){
    throw new Error("Network/CORS failure reaching "+c.endpoint+"\n"+netErr.message+
      "\n\n(If Ollama: start it with OLLAMA_ORIGINS='*' so the browser can call localhost.)");
  }
  if(!res.ok){ const body=await res.text().catch(()=>"" ); throw new Error("HTTP "+res.status+" from endpoint:\n"+body.slice(0,500)); }
  const j=await res.json();
  const txt=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
  if(typeof txt!=="string") throw new Error("Unexpected response shape:\n"+JSON.stringify(j).slice(0,500));
  return txt;
}

/* ---------------- ask flow ---------------- */
async function doAsk(){
  const q=$("q").value.trim(); if(!q) return;
  const aw=$("answerWrap"), cl=$("chunkList"); cl.innerHTML="";
  if(!chunks.length){ aw.innerHTML='<div class="answer err">Corpus is empty. Load files in the Knowledge tab first.</div>'; return; }
  const c=cfg();
  const hits=retrieve(q,c.topk,c.minscore);
  renderChunks(hits);
  if(!hits.length){ aw.innerHTML='<div class="answer notincorpus">NOT IN CORPUS</div><div class="meta">No chunk scored above the minimum match threshold ('+c.minscore+'). Model was not called.</div>'; return; }
  aw.innerHTML='<div class="answer"><span class="spinner"></span> querying '+esc(c.model)+'\u2026</div>';
  $("askBtn").disabled=true;
  const t0=performance.now();
  try{
    const ans=await callModel(q,hits);
    const dt=((performance.now()-t0)/1000).toFixed(1);
    const nic=ans.trim().toUpperCase().startsWith("NOT IN CORPUS");
    aw.innerHTML='<div class="answer'+(nic?" notincorpus":"")+'">'+esc(ans)+'</div>'+
      '<div class="meta">'+esc(c.model)+' &middot; '+hits.length+' chunks &middot; '+dt+'s &middot; sources: '+
      esc([...new Set(hits.map(h=>h.c.source))].join(", "))+'</div>';
  }catch(e){
    aw.innerHTML='<div class="answer err">'+esc(e.message)+'</div>';
  }finally{ $("askBtn").disabled=false; }
}

/* ---------------- rendering ---------------- */
function renderChunks(hits){
  const cl=$("chunkList");
  if(!hits.length){ cl.innerHTML=""; return; }
  cl.innerHTML='<div class="meta">Retrieved context (click to expand):</div>'+hits.map(h=>
    '<div class="chunk"><div class="chunk-head"><span><b>'+esc(h.c.source)+'</b>'+
    (h.c.heading?(' \u00a7 '+esc(h.c.heading)):'')+'</span><span>score '+h.score.toFixed(2)+'</span></div>'+
    '<div class="chunk-body">'+esc(h.c.text)+'</div></div>').join("");
  cl.querySelectorAll(".chunk").forEach(el=>el.addEventListener("click",()=>el.classList.toggle("open")));
}
function renderKB(){
  const nDocs=docs.length, nChunks=chunks.length;
  const bytes=new Blob([JSON.stringify(docs)]).size;
  $("kbStats").innerHTML='<span class="stat">docs <b>'+nDocs+'</b></span>'+
    '<span class="stat">chunks <b>'+nChunks+'</b></span>'+
    '<span class="stat">size <b>'+(bytes/1024).toFixed(0)+' KB</b></span>';
  const counts={}; for(const c of chunks) counts[c.source]=(counts[c.source]||0)+1;
  $("srcTable").innerHTML= nDocs? ('<tr><th>Source</th><th>Chunks</th><th></th></tr>'+
    docs.map(d=>'<tr><td>'+esc(d.source)+'</td><td>'+(counts[d.source]||0)+'</td>'+
      '<td><button class="del" data-src="'+esc(d.source)+'">remove</button></td></tr>').join("")) : "";
  $("srcTable").querySelectorAll(".del").forEach(b=>b.addEventListener("click",()=>{
    docs=docs.filter(d=>d.source!==b.dataset.src); buildIndex(); saveDocs(); renderKB();
  }));
  // warn on ask tab if empty
  $("kbWarn").innerHTML = nChunks? "" :
    '<div class="answer err">No corpus loaded. Go to the Knowledge tab and drop your .md / .txt / .html files (or an EZ ASK bundle).</div>';
}

/* ---------------- connection test ---------------- */
async function testConn(){
  saveCfg(); const c=cfg(); const out=$("testOut");
  out.innerHTML='<span class="spinner"></span> testing '+esc(c.endpoint)+' \u2026';
  $("connDot").className="dot warn";
  const headers={"Content-Type":"application/json"}; if(c.apiKey) headers["Authorization"]="Bearer "+c.apiKey;
  try{
    const res=await fetch(c.endpoint,{method:"POST",headers,body:JSON.stringify({model:c.model,messages:[{role:"user",content:"reply with the single word OK"}],temperature:0,stream:false})});
    if(!res.ok){ const b=await res.text().catch(()=>""); throw new Error("HTTP "+res.status+": "+b.slice(0,300)); }
    const j=await res.json();
    const txt=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||JSON.stringify(j).slice(0,200);
    out.innerHTML='<span style="color:var(--good)">OK</span> &middot; model replied: '+esc(txt.trim().slice(0,120));
    $("connDot").className="dot ok";
  }catch(e){
    out.innerHTML='<span style="color:var(--bad)">FAIL</span> '+esc(e.message);
    $("connDot").className="dot bad";
  }
}

/* ---------------- wiring ---------------- */
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));
  t.classList.add("active"); $("view-"+t.dataset.view).classList.add("active");
}));
$("askBtn").addEventListener("click",doAsk);
$("q").addEventListener("keydown",e=>{ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); doAsk(); }});
$("preset").addEventListener("change",()=>{ const p=PRESETS[$("preset").value]; $("endpoint").value=p.endpoint; if(p.model)$("model").value=p.model; });
$("testBtn").addEventListener("click",testConn);
$("saveBtn").addEventListener("click",()=>{ saveCfg(); $("testOut").textContent="Settings saved."; });
$("exportBtn").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify({format:"ez_ask_docs_v1",docs},null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="ez_ask_bundle.json"; a.click();
});
$("clearBtn").addEventListener("click",()=>{ if(confirm("Clear all loaded corpus?")){ docs=[]; buildIndex(); saveDocs(); renderKB(); }});
const drop=$("drop"), fileIn=$("fileIn");
drop.addEventListener("click",()=>fileIn.click());
fileIn.addEventListener("change",e=>{ ingestFiles([...e.target.files]); fileIn.value=""; });
["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("drag");}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("drag");}));
drop.addEventListener("drop",e=>{ if(e.dataTransfer.files.length) ingestFiles([...e.dataTransfer.files]); });

/* ---------------- boot ---------------- */
loadCfg(); loadDocs(); renderKB();
</script>
</body>
</html>
