<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Butler Surveying — Offset Sheet</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #d8d4c4;
    font-family: Arial, Helvetica, sans-serif;
    color: #000;
  }

  /* Toolbar (screen only) */
  .toolbar {
    background: #3a2818;
    color: white;
    padding: 10px 16px;
    display: flex; gap: 10px; align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    position: sticky; top: 0; z-index: 100;
  }
  .toolbar h1 { font-size: 15px; margin: 0; font-weight: 600; flex: 1; }
  .toolbar button {
    background: #b88a2e; border: none; color: white;
    font-weight: 600; padding: 8px 14px; border-radius: 4px;
    cursor: pointer; font-size: 13px;
  }
  .toolbar button:hover { background: #d4a040; }
  .toolbar button.ghost { background: transparent; border: 1px solid rgba(255,255,255,0.4); }

  .status {
    padding: 8px 16px; font-size: 13px;
    background: #efeadb; border-bottom: 1px solid #c8c0a8;
    min-height: 18px;
  }
  .status.ok   { color: #2a7a2a; background: #eaf6ea; }
  .status.warn { color: #b8860b; background: #fdf6e3; }
  .status.bad  { color: #a02828; background: #fbeaea; }

  /* The sheet — letter */
  .sheet {
    width: 8.5in;
    min-height: 11in;
    margin: 20px auto;
    background: white;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    position: relative;
  }

  .content {
    position: relative;
    z-index: 2;
    padding: 0.35in 0.8in;
    min-height: 11in;
  }

  /* Header: logo left + OFFSETS FOR block right */
  .sheet-header {
    display: flex;
    gap: 12px;
    margin-bottom: 10px;
    align-items: stretch;
  }
  .header-logo-box {
    border: 2px solid #000;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    flex: 0 0 auto;
  }
  .header-logo-box img { width: 230px; height: auto; display: block; }

  .header-info-box {
    border: 2px solid #000;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .header-info-box .info-top {
    border-bottom: 1px solid #000;
    padding: 6px 10px;
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header-info-box .info-bottom {
    display: flex;
    flex: 1;
  }
  .header-info-box .info-bottom .job-cell {
    border-right: 1px solid #000;
    padding: 6px 10px;
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .header-info-box .info-bottom .date-cell {
    padding: 6px 10px;
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .header-info-box .lbl {
    font-weight: bold;
    font-size: 13px;
    font-style: italic;
    white-space: nowrap;
  }
  .header-info-box input {
    border: none;
    border-bottom: 1px solid #000;
    background: transparent;
    font-family: "Segoe Script", "Lucida Handwriting", "Brush Script MT", cursive;
    font-size: 18px;
    flex: 1;
    padding: 0 4px 2px 4px;
    outline: none;
    min-width: 0;
  }
  .header-info-box input:focus { background: #fffae6; }
  .header-info-box input.date-input {
    font-family: Arial, sans-serif;
    font-size: 14px;
    position: relative;
    width: 100%;
    min-width: 0;
  }
  .header-info-box input.date-input::-webkit-calendar-picker-indicator {
    opacity: 0;
    position: absolute;
    right: 0;
    width: 24px;
    cursor: pointer;
  }

  /* The offset table */
  table.offsets {
    width: 100%;
    border-collapse: collapse;
    border: 2px solid #000;
    table-layout: fixed;
  }
  table.offsets col.c-calc   { width: 14%; }
  table.offsets col.c-field  { width: 14%; }
  table.offsets col.c-dir    { width: 17%; }
  table.offsets col.c-dist   { width: 16%; }
  table.offsets col.c-desc   { width: 39%; }
  /* Insert-row button — lives in right edge of DESCRIPTION cell */
  table.offsets td.desc-cell { position: relative; }
  table.offsets td.desc-cell input.desc { padding-right: 36px; }
  .row-ins-btn {
    position: absolute;
    right: 2px; top: 50%;
    transform: translateY(-50%);
    width: 14px; height: 14px;
    border: 1px solid #ccc;
    background: #f0f0f0;
    color: #aaa;
    font-size: 11px; font-weight: bold;
    cursor: pointer;
    border-radius: 2px;
    line-height: 1; padding: 0;
    opacity: 0.35;
    z-index: 3;
  }
  .row-ins-btn:hover { opacity: 1; background: #c8e6c8; color: #2a7a2a; border-color: #2a7a2a; }
  /* Delete-row button — same size as +, positioned just left of it */
  .row-del-btn {
    position: absolute;
    right: 18px; top: 50%;
    transform: translateY(-50%);
    width: 14px; height: 14px;
    border: 1px solid #ccc;
    background: #f0f0f0;
    color: #aaa;
    font-size: 11px; font-weight: bold;
    cursor: pointer;
    border-radius: 2px;
    line-height: 1; padding: 0;
    opacity: 0.35;
    z-index: 3;
  }
  .row-del-btn:hover { opacity: 1; background: #fbeaea; color: #c03030; border-color: #c03030; }

  table.offsets th, table.offsets td {
    border: 1px solid #000;
    padding: 0;
  }
  table.offsets thead th {
    background: white;
    font-size: 12px;
    font-weight: bold;
    font-style: italic;
    text-align: center;
    padding: 4px 2px;
    height: 26px;
  }
  table.offsets td {
    height: 25px;
  }
  table.offsets td input {
    width: 100%; height: 100%;
    border: none; background: transparent;
    font-family: Arial, sans-serif;
    font-size: 13px;
    padding: 2px 6px;
    outline: none;
    text-align: center;
  }
  table.offsets td input:focus { background: #fffae6; }
  table.offsets td input.desc {
    text-align: left;
  }
  /* Monument rows — shaded, dashes through dir/dist */
  table.offsets tr.monument-row td {
    background: #f0ede4;
  }
  table.offsets tr.monument-row td input.dir,
  table.offsets tr.monument-row td input.dist {
    color: #999;
  }
  /* v7: carry-over "holding line" row at top of continued pages */
  table.offsets tr.carry-row td { background:#eef3ea; }
  table.offsets tr.carry-row .carry-ast { color:#1a7a1a; font-weight:bold; }
  table.offsets tr.carry-row .carry-note { display:block; font-size:7px; font-style:italic; color:#555; line-height:1.1; margin-top:1px; }
  /* Monument toggle button in calc cell */
  table.offsets td.calc-cell {
    position: relative;
  }
  table.offsets td.calc-cell input.calc {
    padding-right: 20px;
  }
  .mon-toggle {
    position: absolute;
    top: 50%; right: 2px;
    transform: translateY(-50%);
    width: 15px; height: 15px;
    border: 1px solid #bbb;
    background: #eee;
    color: #888;
    font-size: 9px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 2px;
    line-height: 1;
    padding: 0;
    z-index: 4;
  }
  .mon-toggle:hover { background: #b88a2e; color: white; }
  .mon-toggle.active { background: #3a2818; color: white; }

  /* Submit / log */
  .submit-bar {
    max-width: 8.5in;
    margin: 20px auto;
    padding: 16px 20px;
    background: white;
    border: 1px solid #c8c0a8;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .submit-bar .left { font-size: 13px; color: #555; }
  .submit-bar button {
    padding: 10px 20px;
    background: #2a7a2a;
    color: white; border: none; border-radius: 4px;
    font-weight: 700; cursor: pointer; font-size: 14px;
  }
  .submit-bar button:hover { background: #1a5a1a; }

  .log {
    max-width: 8.5in;
    margin: 20px auto;
    padding: 14px 20px;
    background: #1a1a1a;
    color: #c8e6c8;
    font-family: monospace;
    font-size: 12px;
    border-radius: 4px;
    max-height: 220px;
    overflow-y: auto;
    display: none;
  }
  .log.active { display: block; }
  .log .err  { color: #f88; }
  .log .ok   { color: #8f8; }
  .log .info { color: #aab; }
  .log .warn { color: #fc6; }

  /* Hide print-title-row on screen */
  .print-title-row { display: none; }

  /* Page break indicator — screen only */
  .pgbreak { display: block; }

  /* Print */
  @media print {
    body, html {
      background: white;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .toolbar, .submit-bar, .log, .status,
    .mon-toggle, .row-ins-btn, .row-del-btn, .pgbreak { display: none !important; }
    /* Keep screen header (logo) on page 1 — only hide toolbar clutter */
    .sheet { width: 100%; min-height: auto; margin: 0; box-shadow: none; }
    .content { padding: 0.2in 0.3in !important; min-height: auto !important; }
    /* Slim repeating title row (page 2+ gets this from thead repeat) */
    .print-title-row { display: table-row !important; }
    .print-title-cell {
      text-align: center;
      font-size: 12pt;
      font-weight: bold;
      font-style: normal;
      letter-spacing: 0.08em;
      padding: 6px 8px;
    }
    /* ALL borders identical — no thick/thin mix */
    table.offsets { border-collapse: collapse; border: 1pt solid #000; page-break-inside: auto; }
    table.offsets tr { page-break-inside: avoid; }
    table.offsets tbody.carry-tbody { break-before: page; page-break-before: always; }
    table.offsets tr.carry-row td { background:#e9e9e9 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    table.offsets th,
    table.offsets td { border: 1pt solid #000; }
    /* Column headers */
    table.offsets thead tr:last-child th {
      font-size: 10pt;
      font-style: normal;
      font-weight: bold;
      padding: 4px 3px;
    }
    /* Hide trailing blank rows */
    tr.print-hidden { display: none !important; }
    input:focus { background: transparent !important; outline: none !important; }
    input::-webkit-calendar-picker-indicator { display: none !important; }
    input.date-input { -webkit-appearance: none; appearance: none; }
    /* margin value left at 0.5in (untouched); the 16 empty margin boxes below
       suppress Chrome's default URL/date/page-number header & footer */
    @page {
      size: letter portrait;
      margin: 0.5in;
      @top-left-corner     { content: ""; }
      @top-left            { content: ""; }
      @top-center          { content: ""; }
      @top-right           { content: ""; }
      @top-right-corner    { content: ""; }
      @bottom-left-corner  { content: ""; }
      @bottom-left         { content: ""; }
      @bottom-center       { content: ""; }
      @bottom-right        { content: ""; }
      @bottom-right-corner { content: ""; }
      @left-top            { content: ""; }
      @left-middle         { content: ""; }
      @left-bottom         { content: ""; }
      @right-top           { content: ""; }
      @right-middle        { content: ""; }
      @right-bottom        { content: ""; }
    }
  }
</style>
</head>

          <th colspan="5" class="print-title-cell" id="print-title-cell">BUTLER SURVEYING — OFFSET SHEET</th>
        </tr>
        <tr>
          <th>CALC #</th>
          <th>FIELD #</th>
          <th>DIRECTION</th>
          <th>DISTANCE</th>
          <th>DESCRIPTION</th>
        </tr>
      </thead>
      <tbody id="offset-tbody">

      </tbody>
    </table>


  </div>
</div>

<div class="submit-bar">
  <div class="left">
    <strong>Pull from EZ PZ</strong> auto-fills calculated offsets. <strong>Print</strong> for the field crew.
  </div>
  <button onclick="newBlankSheet()" class="blank-btn">🗑 New Blank Sheet</button>
  <button onclick="window.print()">🖨 Print Offset Sheet</button>
</div>

<div class="log" id="log"></div>

<script>
/* ===== CHANGELOG =====
   v8 (2026-06-22):
     - Carry-over line at top of continued pages is now normal weight (was bold).
       The held number is marked with an asterisk and a "* FROM PREVIOUS PAGE"
       note, replacing the green check.
   v7 (2026-06-08):
     - Continued pages now begin with the last monument (the line being held),
       stamped with a check, so a fresh crew always knows which line is held.
   v6 (2026-06-08):
     - Opens BLANK: storage key bumped to 'butler_offset_sheet_v6' so a cached
       fill (e.g. a previously typed-in job) no longer auto-loads.
     - "New Blank Sheet" button added (clears the sheet without a new file).
     - Page-break guide relabeled "CUT LINE" (the line where the plotter trims).
   ===================== */
const N_ROWS_INIT = 40;
const LS_KEY = 'butler_offset_sheet_v6';  /* v6: bumped key -> opens blank, ignores any cached fill */
const EZPZ_KEY = 'ez_current_job';

let sheetState = {
  offsets_for: '',
  job_number: '',
  sheet_date: '',
  rows: []
};

function makeRow() {
  return { calc: '', field: '', dir: '', dist: '', desc: '', is_monument: false };
}

function buildRowHTML(idx) {
  return '<tr data-row="' + idx + '">' +
    '<td class="calc-cell"><input type="text" class="calc" data-row="' + idx + '" data-field="calc">' +
      '<button class="mon-toggle" data-row="' + idx + '" title="Mark as monument row">M</button></td>' +
    '<td><input type="text" class="field" data-row="' + idx + '" data-field="field"></td>' +
    '<td><input type="text" class="dir" data-row="' + idx + '" data-field="dir"></td>' +
    '<td><input type="text" class="dist" data-row="' + idx + '" data-field="dist"></td>' +
    '<td class="desc-cell"><input type="text" class="desc" data-row="' + idx + '" data-field="desc">' +
      '<button class="row-del-btn" data-row="' + idx + '" title="Delete this row">×</button>' +
      '<button class="row-ins-btn" data-row="' + idx + '" title="Insert blank row below">+</button>' +
    '</td>' +
  '</tr>';
}

function renderRows() {
  const tbody = document.getElementById('offset-tbody');
  tbody.innerHTML = '';
  sheetState.rows.forEach((row, idx) => {
    tbody.insertAdjacentHTML('beforeend', buildRowHTML(idx));
  });
  // Populate values + wire events
  sheetState.rows.forEach((row, idx) => {
    const tr = tbody.querySelector('tr[data-row="' + idx + '"]');
    if (!tr) return;
    tr.querySelector('input.calc').value  = row.calc || '';
    tr.querySelector('input.field').value = row.field || '';
    tr.querySelector('input.dir').value   = row.dir || '';
    tr.querySelector('input.dist').value  = row.dist || '';
    tr.querySelector('input.desc').value  = row.desc || '';
    if (row.is_monument) tr.classList.add('monument-row');
    const tog = tr.querySelector('.mon-toggle');
    if (row.is_monument) tog.classList.add('active');
  });
  wireRowEvents();
  drawPageBreaks();
}

function deleteRow(idx) {
  if (sheetState.rows.length <= 1) { setStatus('Cannot delete last row.', 'warn'); return; }
  const label = sheetState.rows[idx].field || ('row ' + (idx + 1));
  sheetState.rows.splice(idx, 1);
  renderRows();
  saveState();
  setStatus('“' + label + '” deleted.', 'ok');
}

function insertRowBelow(idx) {
  sheetState.rows.splice(idx + 1, 0, makeRow());
  renderRows();
  saveState();
  setStatus('Blank row inserted below row ' + (idx + 1) + '.', 'ok');
}

function wireRowEvents() {
  document.querySelectorAll('#offset-tbody input').forEach(el => {
    el.addEventListener('input', (e) => {
      const idx = parseInt(e.target.dataset.row);
      const field = e.target.dataset.field;
      sheetState.rows[idx][field] = e.target.value;
      saveState();
    });
  });
  document.querySelectorAll('.row-del-btn').forEach(btn => {
    btn.addEventListener('click', (e) => { deleteRow(parseInt(e.target.dataset.row)); });
  });
  document.querySelectorAll('.row-ins-btn').forEach(btn => {
    btn.addEventListener('click', (e) => { insertRowBelow(parseInt(e.target.dataset.row)); });
  });
  document.querySelectorAll('.mon-toggle').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const idx = parseInt(e.target.dataset.row);
      const row = sheetState.rows[idx];
      row.is_monument = !row.is_monument;
      const tr = document.querySelector('#offset-tbody tr[data-row="' + idx + '"]');
      tr.classList.toggle('monument-row', row.is_monument);
      e.target.classList.toggle('active', row.is_monument);

      const DASH = '- - - - - - - - -';
      const calcInp  = tr.querySelector('input.calc');
      const fieldInp = tr.querySelector('input.field');
      const dirInp   = tr.querySelector('input.dir');
      const distInp  = tr.querySelector('input.dist');

      if (row.is_monument) {
        // Stamp dashes into empty CALC and empty FIELD; always stamp DIR and DIST
        if (!row.calc)  { row.calc  = DASH; calcInp.value  = DASH; }
        if (!row.field) { row.field = DASH; fieldInp.value = DASH; }
        row.dir  = DASH; dirInp.value  = DASH;
        row.dist = DASH; distInp.value = DASH;
      } else {
        // Remove any dashes that M put in
        if (row.calc  === DASH) { row.calc  = ''; calcInp.value  = ''; }
        if (row.field === DASH) { row.field = ''; fieldInp.value = ''; }
        if (row.dir   === DASH) { row.dir   = ''; dirInp.value   = ''; }
        if (row.dist  === DASH) { row.dist  = ''; distInp.value  = ''; }
      }

      saveState();
    });
  });
}

function addRows(n) {
  for (let i = 0; i < n; i++) sheetState.rows.push(makeRow());
  renderRows();
  saveState();
  setStatus('Added ' + n + ' rows. Total: ' + sheetState.rows.length + '.', 'ok');
}

function fmtDate(iso) {
  // Convert YYYY-MM-DD → MM/DD/YYYY for display
  if (!iso) return '';
  const p = iso.split('-');
  return p.length === 3 ? p[1] + '/' + p[2] + '/' + p[0] : iso;
}
function updatePrintTitle() {
  const el = document.getElementById('print-title-cell');
  if (!el) return;
  const parts = ['BUTLER SURVEYING — OFFSET SHEET'];
  if (sheetState.job_number)  parts.push('# ' + sheetState.job_number);
  if (sheetState.offsets_for) parts.push(sheetState.offsets_for);
  if (sheetState.sheet_date)  parts.push(fmtDate(sheetState.sheet_date));
  el.textContent = parts.join('   ·   ');
}

function attachHeaderListeners() {
  document.getElementById('offsets-for').addEventListener('input', (e) => {
    sheetState.offsets_for = e.target.value; saveState(); updatePrintTitle();
  });
  document.getElementById('job-number').addEventListener('input', (e) => {
    sheetState.job_number = e.target.value; saveState(); updatePrintTitle();
  });
  document.getElementById('sheet-date').addEventListener('change', (e) => {
    sheetState.sheet_date = e.target.value; saveState(); updatePrintTitle();
  });
}

// Hide trailing blank rows before printing; restore after
window.addEventListener('beforeprint', () => {
  const rows = sheetState.rows;
  let lastFilled = -1;
  rows.forEach((r, i) => {
    if (r.calc || r.field || r.dir || r.dist || r.desc || r.is_monument) lastFilled = i;
  });
  document.querySelectorAll('#offset-tbody tr').forEach((tr, i) => {
    if (i > lastFilled + 1) tr.classList.add('print-hidden');
  });
  insertCarryRowsForPrint();
});
window.addEventListener('afterprint', () => {
  removeCarryRows();
  document.querySelectorAll('.print-hidden').forEach(tr => tr.classList.remove('print-hidden'));
});

function loadHeaderIntoFields() {
  document.getElementById('offsets-for').value = sheetState.offsets_for || '';
  document.getElementById('job-number').value  = sheetState.job_number || '';
  document.getElementById('sheet-date').value  = sheetState.sheet_date || '';
}

function saveState() {
  localStorage.setItem(LS_KEY, JSON.stringify(sheetState));
}
function loadState() {
  const stored = localStorage.getItem(LS_KEY);
  if (stored) {
    try {
      sheetState = JSON.parse(stored);
      if (!sheetState.rows) sheetState.rows = [];
    } catch (e) { initBlankState(); }
  } else {
    initBlankState();
  }
}
function initBlankState() {
  sheetState = { offsets_for: '', job_number: '', sheet_date: '', rows: [] };
  for (let i = 0; i < N_ROWS_INIT; i++) sheetState.rows.push(makeRow());
}

/* v6: wipe to a fresh blank sheet without needing a new file */
function newBlankSheet() {
  if (!confirm('Clear this sheet and start blank? Anything typed here will be erased.')) return;
  initBlankState();
  loadHeaderIntoFields();
  updatePrintTitle();
  renderRows();
  saveState();
  setStatus('New blank sheet ready.', 'ok');
}

/* ===== EZ PZ integration =====
   Reads ez_current_job from localStorage. Expected shape (planned):
   {
     job_number: "26-127",
     client_name: "Scott",
     offsets: [
       { calc: "1111", dir: "N22E", dist: 4.34, desc: "" },
       { calc: "108",  dir: "",     dist: null, desc: "FD b+c", is_monument: true },
       ...
     ]
   }
*/
function pullFromEZPZ() {
  const raw = localStorage.getItem(EZPZ_KEY);
  if (!raw) {
    setStatus('No EZ PZ job found in this browser. Open EZ PZ, calculate offsets, then come back.', 'warn');
    log('ez_current_job key not present in localStorage', 'warn');
    return;
  }
  let job;
  try { job = JSON.parse(raw); }
  catch (e) {
    setStatus('EZ PZ data found but could not be read.', 'bad');
    log('Failed to parse ez_current_job: ' + e.message, 'err');
    return;
  }

  if (!job.offsets || !Array.isArray(job.offsets) || job.offsets.length === 0) {
    setStatus('EZ PZ job has no calculated offsets yet.', 'warn');
    log('ez_current_job present but offsets array empty or missing', 'warn');
    return;
  }

  // Header info
  if (job.client_name) sheetState.offsets_for = job.client_name;
  if (job.job_number)  sheetState.job_number  = job.job_number;

  // Map EZ PZ offsets into rows
  const newRows = job.offsets.map(o => ({
    calc:  o.calc != null ? String(o.calc) : '',
    field: '',
    dir:   o.dir || '',
    dist:  (o.dist != null && o.dist !== '') ? String(o.dist) : '',
    desc:  o.desc || '',
    is_monument: !!o.is_monument
  }));

  // Pad with blank rows up to N_ROWS_INIT minimum
  while (newRows.length < N_ROWS_INIT) newRows.push(makeRow());

  sheetState.rows = newRows;
  loadHeaderIntoFields();
  renderRows();
  saveState();

  const monCount = job.offsets.filter(o => o.is_monument).length;
  const offCount = job.offsets.length - monCount;
  setStatus('Pulled ' + job.offsets.length + ' rows from EZ PZ (' + offCount + ' offsets, ' + monCount + ' monuments). Verify each row.', 'ok');
  log('Pulled ' + job.offsets.length + ' rows from EZ PZ job ' + (job.job_number || '(no #)'), 'ok');
}

function setStatus(msg, level) {
  const s = document.getElementById('status');
  s.textContent = msg;
  s.className = 'status' + (level ? ' ' + level : '');
}
function log(msg, level) {
  const l = document.getElementById('log');
  l.classList.add('active');
  const line = document.createElement('div');
  line.className = level || 'info';
  line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  l.appendChild(line);
  l.scrollTop = l.scrollHeight;
}

/* ===== v7: carry-over "holding line" row =====================================
   On print, each page after the first opens with the last monument (M) still
   in effect, marked with a check, so the crew always knows the line they hold.
   Inserted at beforeprint with a forced page-break; removed at afterprint. */
let _carryTrs = [];
const _CARRY_DASH = '- - - - - - - - -';

function _offPageCaps() {
  const sheet = document.querySelector('.sheet');
  const tbodyEl = document.getElementById('offset-tbody');
  if (!sheet || !tbodyEl) return null;
  const allRows = tbodyEl.querySelectorAll('tr');
  if (!allRows.length) return null;
  const firstRowEl = allRows[0];
  const ROW_H = firstRowEl.offsetHeight || 25;
  const sheetTop = sheet.getBoundingClientRect().top + window.scrollY;
  const firstRowTop = firstRowEl.getBoundingClientRect().top + window.scrollY - sheetTop;
  const PAGE_H = 11*96, MARGIN = 0.31*96, CPAD = 2*(0.2*96);
  const USABLE = PAGE_H - 2*MARGIN - CPAD;
  const SCREEN_PAD_T = 0.35*96, PRINT_PAD_T = 0.20*96, TITLE_H = 30;
  const p1Overhead = firstRowTop + (PRINT_PAD_T + TITLE_H - SCREEN_PAD_T);
  const rowsP1 = Math.max(5, Math.floor((USABLE - p1Overhead) / ROW_H));
  const colHdrEl = sheet.querySelector('thead tr:last-child');
  const COL_H = colHdrEl ? Math.round(colHdrEl.getBoundingClientRect().height) : 26;
  const rowsPN = Math.max(5, Math.floor((USABLE - PRINT_PAD_T - TITLE_H - COL_H) / ROW_H));
  return { rowsP1, rowsPN };
}
function _monNumber(row) {
  const c = (row.calc || '').trim(), f = (row.field || '').trim();
  if (c && c !== _CARRY_DASH) return c;
  if (f && f !== _CARRY_DASH) return f;
  return '';
}
function _escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function buildCarryTr(monRow) {
  const num = _monNumber(monRow);
  const desc = (monRow.desc || '').trim();
  const tr = document.createElement('tr');
  tr.className = 'monument-row carry-row';
  tr.innerHTML =
    '<td class="calc-cell"><span class="carry-num">' + _escHtml(num) + '</span><span class="carry-ast">*</span>' +
      '<span class="carry-note">* FROM PREVIOUS PAGE</span></td>' +
    '<td></td><td></td><td></td>' +
    '<td class="desc-cell">' + (desc ? _escHtml(desc) + ' \u2014 ' : '') + 'HOLDING LINE</td>';
  return tr;
}
let _carryTbodies = [];
function removeCarryRows() {
  _carryTrs.forEach(tr => tr.remove()); _carryTrs = [];
  if (_carryTbodies.length) {
    const tbody0 = document.getElementById('offset-tbody');
    _carryTbodies.forEach(tb => {
      Array.from(tb.querySelectorAll('tr')).forEach(tr => tbody0.appendChild(tr));
      tb.remove();
    });
    _carryTbodies = [];
    Array.from(tbody0.querySelectorAll('tr'))
      .sort((a, b) => (parseInt(a.getAttribute('data-row')) || 0) - (parseInt(b.getAttribute('data-row')) || 0))
      .forEach(tr => tbody0.appendChild(tr));
  }
}
function insertCarryRowsForPrint() {
  removeCarryRows();
  const caps = _offPageCaps(); if (!caps) return;
  const rowsP1 = caps.rowsP1, rowsPN = caps.rowsPN;
  const table = document.querySelector('table.offsets');
  const tbody0 = document.getElementById('offset-tbody');
  const domRows = Array.from(tbody0.querySelectorAll('tr'))
    .filter(tr => !tr.classList.contains('print-hidden') && !tr.classList.contains('carry-row'));
  let slots = rowsP1, lastMon = null, curTb = null;
  for (let i = 0; i < domRows.length; i++) {
    if (slots === 0) {
      const tb = document.createElement('tbody');
      tb.className = 'carry-tbody';
      table.appendChild(tb);
      _carryTbodies.push(tb);
      if (lastMon) {
        const carry = buildCarryTr(lastMon);
        tb.appendChild(carry);
        _carryTrs.push(carry);
        slots = rowsPN - 1;
      } else { slots = rowsPN; }
      curTb = tb;
    }
    if (curTb) curTb.appendChild(domRows[i]);
    const idx = parseInt(domRows[i].getAttribute('data-row'));
    const row = sheetState.rows[idx];
    if (row && row.is_monument) lastMon = row;
    slots--;
  }
}

function drawPageBreaks() {
  document.querySelectorAll('.pgbreak').forEach(e => e.remove());
  const sheet = document.querySelector('.sheet');
  if (!sheet) return;
  const sheetTop = sheet.getBoundingClientRect().top + window.scrollY;
  const tbodyEl  = document.getElementById('offset-tbody');
  const allRows  = tbodyEl.querySelectorAll('tr');
  if (!allRows.length) return;

  // Measure first data row — the only reliable DOM measurement
  const firstRowEl  = allRows[0];
  const firstRowTop = firstRowEl.getBoundingClientRect().top + window.scrollY - sheetTop;
  const ROW_H       = firstRowEl.offsetHeight || 25;

  // --- Print constants (all in CSS px at 96 px/in) ---
  // From your print preview: effective margin ~0.31 in (printer hardware minimum)
  const PAGE_H  = 11   * 96;          // 1056  letter height
  const MARGIN  = 0.31 * 96;          // 29.8  each side (observed)
  const CPAD    = 2 * (0.2 * 96);     // 38.4  content top+bottom padding in print
  const USABLE  = PAGE_H - 2*MARGIN - CPAD;   // ~958 px available per page

  // --- Offset between screen layout and print layout ---
  // Screen content-padding-top : 0.35in = 33.6 px
  // Print  content-padding-top : 0.20in = 19.2 px
  // Print-title-row (hidden on screen, shown in print) ~ 30 px
  const SCREEN_PAD_T = 0.35 * 96;
  const PRINT_PAD_T  = 0.20 * 96;
  const TITLE_H      = 30;

  // Effective print overhead before first data row on page 1:
  //   firstRowTop (screen) encodes: SCREEN_PAD_T + logoHeader + margin + colHeader
  //   In print that same content occupies: PRINT_PAD_T + logoHeader + margin + TITLE_H + colHeader
  //   Net difference = PRINT_PAD_T + TITLE_H - SCREEN_PAD_T = 19.2 + 30 - 33.6 = +15.6 px
  const p1Overhead = firstRowTop + (PRINT_PAD_T + TITLE_H - SCREEN_PAD_T);

  // Rows per page 1
  const rowsP1 = Math.max(5, Math.floor((USABLE - p1Overhead) / ROW_H));

  // Rows per page 2+ (no logo header — only title row + col header)
  const colHdrEl = sheet.querySelector('thead tr:last-child');
  const COL_H    = colHdrEl ? Math.round(colHdrEl.getBoundingClientRect().height) : 26;
  const rowsPN   = Math.max(5, Math.floor((USABLE - PRINT_PAD_T - TITLE_H - COL_H) / ROW_H));

  // Compute break positions and draw red dashed lines on screen
  const breaks = [];
  let at = rowsP1;
  while (at < allRows.length) { breaks.push(at); at += (rowsPN - 1); /* v7: carry row uses one slot on pg 2+ */ }

  breaks.forEach(n => {
    const y = Math.round(firstRowTop + n * ROW_H);
    const d = document.createElement('div');
    d.className = 'pgbreak';
    d.style.cssText =
      'position:absolute;left:0;right:0;top:' + y + 'px;height:0;' +
      'border-top:2px dashed #cc0000;pointer-events:none;z-index:20;';
    const s = document.createElement('span');
    s.style.cssText =
      'position:absolute;right:6px;top:-9px;font-size:8px;' +
      'font-family:monospace;font-weight:bold;' +
      'color:#cc0000;background:white;padding:0 3px;letter-spacing:.04em;';
    s.textContent = '── CUT LINE · next pg repeats holding M ✓ ──';
    d.appendChild(s);
    sheet.appendChild(d);
  });
}

window.addEventListener('load', () => {
  loadState();
  loadHeaderIntoFields();
  attachHeaderListeners();
  updatePrintTitle();
  renderRows(); // drawPageBreaks called inside renderRows
});
window.addEventListener('beforeunload', saveState);
</script>

</body>
</html>
